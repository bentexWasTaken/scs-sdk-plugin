name: Build SCS Plugin
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $repo = (Get-Location).Path
          nuget restore .\scs-client\C#\SCSSdkClient\SCSSdk.sln -PackagesDirectory "$repo\scs-client\C#\SCSSdkClient\packages"
      - name: Build Solution
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Include *.sln,*.vcxproj | Select-Object -First 1
          Write-Host "Found project: $($proj.FullName)"
          msbuild "$($proj.FullName)" /p:Configuration=Release /p:Platform=x64
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: scs-telemetry-dll
          path: '**/Release/*.dll'
