name: Build SCS Plugin
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Restore Newtonsoft.Json package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = (Get-Location).Path
          $packageDir = Join-Path $repo 'scs-client/C#/SCSSdkClient/packages/Newtonsoft.Json.11.0.2'
          $archive = Join-Path $env:RUNNER_TEMP 'newtonsoft-json.11.0.2.nupkg'
          Invoke-WebRequest 'https://www.nuget.org/api/v2/package/Newtonsoft.Json/11.0.2' -OutFile $archive
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Expand-Archive -Path $archive -DestinationPath $packageDir -Force
          $dll = Join-Path $packageDir 'lib/net45/Newtonsoft.Json.dll'
          if (-not (Test-Path $dll)) { throw "Newtonsoft.Json package did not contain $dll" }
      - name: Build Solution
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Include *.sln,*.vcxproj | Select-Object -First 1
          Write-Host "Found project: $($proj.FullName)"
          msbuild "$($proj.FullName)" /p:Configuration=Release /p:Platform=x64
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: scs-telemetry-dll
          path: '**/Release/*.dll'
