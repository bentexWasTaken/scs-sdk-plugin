name: Build SCS Plugin
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = (Get-Location).Path
          $packages = Join-Path $repo 'scs-client/C#/SCSSdkClient/packages'
          $config = Join-Path $repo 'scs-client/C#/SCSSdkClient.Demo/SCSSdkClient.Demo/packages.config'
          nuget install $config -OutputDirectory $packages -Force -NonInteractive -Verbosity detailed
          if ($LASTEXITCODE -ne 0) { throw "NuGet package installation failed with exit code $LASTEXITCODE." }
          $expected = Join-Path $packages 'Newtonsoft.Json.11.0.2/lib/net45/Newtonsoft.Json.dll'
          if (-not (Test-Path $expected)) {
            $source = Get-ChildItem $repo -Recurse -Filter Newtonsoft.Json.dll | Select-Object -First 1
            if (-not $source) { throw 'NuGet did not produce Newtonsoft.Json.dll anywhere in the checkout.' }
            New-Item -ItemType Directory -Force -Path (Split-Path $expected) | Out-Null
            Copy-Item $source.FullName $expected -Force
          }
      - name: Build Solution
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Include *.sln,*.vcxproj | Select-Object -First 1
          Write-Host "Found project: $($proj.FullName)"
          msbuild "$($proj.FullName)" /p:Configuration=Release /p:Platform=x64
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: scs-telemetry-dll
          path: '**/Release/*.dll'
